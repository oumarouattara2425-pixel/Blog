{% extends "base.html" %}
{% block title %}Connexion — ConstructLearn Pro{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🏗️</div>
    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Accédez à vos formations</p>
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input class="form-input" type="email" name="email" required autofocus
               placeholder="vous@exemple.com" value="{{ request.form.get('email', '') }}">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-with-icon">
          <input class="form-input" type="password" name="password" id="pw" required placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePw()"><i class="ti ti-eye" id="pw-icon"></i></button>
        </div>
      </div>
      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Se souvenir de moi
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    </form>
    <p class="auth-switch">Pas encore de compte ?
      <a href="{{ url_for('auth.register') }}">Créer un compte gratuit</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePw() {
  const pw = document.getElementById('pw');
  const ic = document.getElementById('pw-icon');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  ic.className = pw.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
}
</script>
{% endblock %}
